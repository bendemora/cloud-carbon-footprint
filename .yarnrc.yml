compressionLevel: mixed

enableGlobalCache: true

nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-outdated.cjs
    spec: "https://github.com/mskelton/yarn-plugin-outdated/raw/main/bundles/@yarnpkg/plugin-outdated.js"

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# Fetch native optional dependencies (e.g. nx) for macOS and Linux on arm64 as
# well as the current platform, so one node_modules works from both a macOS
# terminal and a Linux shell mounted on the same checkout.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64]
