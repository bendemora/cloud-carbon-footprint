name: Changeset

on:
  push:
    branches:
      - trunk
    paths-ignore:
      - 'microsite/**'
      - '.github/workflows/deploy-microsite.yml'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  create-release-pr:
    name: Create Changeset PR
    runs-on: ubuntu-latest
    # The repository's default token is read-only. changesets/action pushes
    # the changeset-release/trunk branch and opens the Version Packages pull
    # request, which needs these two. Opening the pull request also needs
    # "Allow GitHub Actions to create and approve pull requests" in
    # Settings > Actions > General.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run:  yarn install --immutable

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: yarn run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
