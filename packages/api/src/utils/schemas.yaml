# Schemas used for Swagger Documentation (follows OpenAPI Specs)
# These represent types that are defined in the Common package and will need to be updated when its counterpart is changed

components:
  schemas:
    FootprintResponse:
      type: object
      properties:
        timestamp:
          type: string
        serviceEstimates:
          type: array
          items:
            type: object
            properties:
              cloudProvider:
                type: string
                enum: [aws, gcp, azure]
              kilowattHours:
                type: number
              co2e:
                type: number
              cost:
                type: number
              usesAverageCPUConstant?:
                type: boolean
              accountId:
                type: string
              accountName:
                type: string
              serviceName:
                type: string
              region:
                type: string
              tags:
                schema:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
              provenance:
                type: object
                description: Where the grid intensity behind co2e came from. Optional. Present on AWS, Google Cloud and Azure estimates computed from billing data. Absent on estimates from the cloud usage APIs (billing data turned off), on rows cached before it was recorded, and on Alibaba Cloud and on-premise rows.
                required: [sourceId, zoneId, granularity, basis, factorType, isEstimated, licenceId, qualityTier, gCO2ePerKWh, modelVersion]
                properties:
                  sourceId:
                    type: string
                    description: The id of the grid intensity source, for example static
                  zoneId:
                    type: string
                    description: The source's zone for the region, not the cloud availability zone. The static source names it after the region (aws:eu-west-2, for example)
                  granularity:
                    type: string
                    enum: [hour, day, month, year]
                  basis:
                    type: string
                    enum: [location-consumption, location-production, marginal]
                  factorType:
                    type: string
                    enum: [lifecycle, direct]
                  isEstimated:
                    type: boolean
                  licenceId:
                    type: string
                    enum: [public-domain, CC-BY-4.0, open-attribution, non-commercial, commercial, custom]
                  qualityTier:
                    type: string
                    enum: [A, B, C, D]
                  gCO2ePerKWh:
                    type: number
                    description: Grid intensity applied to the row, in gCO2e/kWh. kilowattHours includes embodied emissions converted at this factor, so for a row with a co2e value, co2e (tonnes) is kilowattHours times this value divided by 1,000,000.
                  modelVersion:
                    type: string
                  calibrationVersion:
                    type: string
                    description: Optional. Present when calibration was applied.
        periodStartDate:
          type: string
        periodEndDate:
          type: string
        groupBy:
          type: string
    EmissionResponse:
      type: object
      properties:
        cloudProvider:
          type: string
        region:
          type: string
        mtPerKwHour:
          type: number
          description: metric ton co2e per kilowatt-hour
    RecommendationsResponse:
      type: object
      properties:
        cloudProvider:
          type: string
          enum: [aws, gcp, azure]
        accountId:
          type: string
        accountName:
          type: string
        region:
          type: string
        recommendationType:
          type: string
        recommendationDetail?:
          type: string
        resourceId?:
          type: string
        instanceName?:
          type: string
        kilowattHourSavings:
          type: number
        costSavings:
          type: number
        co2eSavings:
          type: number
        recommendationOptions?:
          type: object
    GridIntensityCapabilitiesResponse:
      type: object
      description: The grid zone of each provider region, and what each configured grid intensity source can deliver for it. Tiers are for a day of usage, the finest usage period the estimates have.
      required: [generatedAt, regions]
      properties:
        generatedAt:
          type: string
          format: date-time
        regions:
          type: array
          items:
            type: object
            required: [provider, region, gridZoneId, sources]
            properties:
              provider:
                type: string
                enum: [AWS, GCP, AZURE]
              region:
                type: string
              gridZoneId:
                type: string
                nullable: true
                description: The electricity grid the region is on, from the grid zone registry (GB or US-MIDA-PJM, for example), or null when the registry has no zone for the region
              sources:
                type: array
                description: One entry per configured source, in GRID_INTENSITY_SOURCES order
                items:
                  type: object
                  required: [sourceId, zoneId, licenceState, bestTier, coverage]
                  properties:
                    sourceId:
                      type: string
                    zoneId:
                      type: string
                      nullable: true
                      description: The source's own zone for the region, or null when it has none
                    licenceState:
                      type: string
                      enum: [open, acknowledged, needs-acknowledgement, unavailable]
                      description: open needs no acknowledgement. acknowledged and needs-acknowledgement say whether the source is listed in GRID_INTENSITY_LICENCE_ACKNOWLEDGEMENTS, and a source that needs acknowledgement is not used. unavailable means the source has no zone or no data for the region.
                    bestTier:
                      type: object
                      description: The best quality tier the source can deliver for a day of usage in each window ending now, or null when it can deliver none. It is what the source offers, also for a source that needs acknowledgement.
                      required: [last24Hours, last30Days, last12Months]
                      properties:
                        last24Hours:
                          type: string
                          enum: [A, B, C, D, null]
                          nullable: true
                        last30Days:
                          type: string
                          enum: [A, B, C, D, null]
                          nullable: true
                        last12Months:
                          type: string
                          enum: [A, B, C, D, null]
                          nullable: true
                    coverage:
                      type: object
                      description: The share of the UTC days in each window that the source can serve, in whole or in part, from 0 to 1. A short lookback or late data shows here.
                      required: [last24Hours, last30Days, last12Months]
                      properties:
                        last24Hours:
                          type: number
                        last30Days:
                          type: number
                        last12Months:
                          type: number
                    attribution:
                      type: string
                      description: Text to show wherever the source's data for the zone is shown
                    error:
                      type: string
                      description: A failed or unauthenticated probe of the source, or the reason the fetches of the zone are stopped
