# Schemas used for Swagger Documentation (follows OpenAPI Specs)
# These represent types that are defined in the Common package and will need to be updated when its counterpart is changed

components:
  schemas:
    FootprintResponse:
      type: object
      properties:
        timestamp:
          type: string
        serviceEstimates:
          type: array
          items:
            type: object
            properties:
              cloudProvider:
                type: string
                enum: [aws, gcp, azure]
              kilowattHours:
                type: number
              co2e:
                type: number
              cost:
                type: number
              usesAverageCPUConstant?:
                type: boolean
              accountId:
                type: string
              accountName:
                type: string
              serviceName:
                type: string
              region:
                type: string
              tags:
                schema:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
              provenance?:
                type: object
                description: Where the grid intensity behind co2e came from. Absent on rows estimated before it was recorded, and for Alibaba Cloud and on-premise rows.
                properties:
                  sourceId:
                    type: string
                    description: For example static or electricitymaps-v3
                  zoneId:
                    type: string
                    description: The grid zone, not the cloud availability zone
                  granularity:
                    type: string
                    enum: [hour, day, month, year]
                  basis:
                    type: string
                    enum: [location-consumption, location-production, marginal]
                  factorType:
                    type: string
                    enum: [lifecycle, direct]
                  isEstimated:
                    type: boolean
                  licenceId:
                    type: string
                    enum: [public-domain, CC-BY-4.0, open-attribution, non-commercial, commercial, custom]
                  qualityTier:
                    type: string
                    enum: [A, B, C, D]
                  gCO2ePerKWh:
                    type: number
                    description: Grid intensity applied to the row's operational energy
                  modelVersion:
                    type: string
                  calibrationVersion?:
                    type: string
        periodStartDate:
          type: string
        periodEndDate:
          type: string
        groupBy:
          type: string
    EmissionResponse:
      type: object
      properties:
        cloudProvider:
          type: string
        region:
          type: string
        mtPerKwHour:
          type: number
          description: metric ton co2e per kilowatt-hour
    RecommendationsResponse:
      type: object
      properties:
        cloudProvider:
          type: string
          enum: [aws, gcp, azure]
        accountId:
          type: string
        accountName:
          type: string
        region:
          type: string
        recommendationType:
          type: string
        recommendationDetail?:
          type: string
        resourceId?:
          type: string
        instanceName?:
          type: string
        kilowattHourSavings:
          type: number
        costSavings:
          type: number
        co2eSavings:
          type: number
        recommendationOptions?:
          type: object
